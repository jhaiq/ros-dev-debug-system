version: '3.8'

services:
  ros-dev-debug:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - ROSBRIDGE_URL=ws://rosbridge:9090
      - ROS_DOMAIN_ID=0
    depends_on:
      - rosbridge
    networks:
      - ros-network

  rosbridge:
    image: ros:humble-ros-base
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml
    ports:
      - "9090:9090"
    environment:
      - ROS_DOMAIN_ID=0
    networks:
      - ros-network

  # Trace Proxy — 拦截 ROS 消息，注入 trace metadata，延迟统计
  trace-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.proxy
    ports:
      - "9091:9091"
      - "9092:9092"
    environment:
      - PROXY_PORT=9091
      - API_PORT=9092
      - ROSBRIDGE_URL=ws://rosbridge:9090
      - ROS_DOMAIN_ID=0
    depends_on:
      - rosbridge
    networks:
      - ros-network

  # 可选：rosapi 用于获取 ROS 系统信息
  rosapi:
    image: ros:humble-ros-base
    command: ros2 run rosapi rosapi_node
    ports:
      - "9093:9093"
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_HOSTNAME=rosapi
    networks:
      - ros-network

networks:
  ros-network:
    driver: bridge
